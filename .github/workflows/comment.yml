name: comment

# This workflow runs from the default branch with a token that can write to
# pull requests, so it must never check out or run code from a pull request:
# a fork's PR could otherwise use that token. It only reads the artifact the
# check workflow produced and posts its text and screenshots.
on:
  workflow_run:
    workflows: [check]
    types: [completed]

# `contents: write` is only for writing preview images to `refs/previews/pr-<number>`. It is the
# reason this workflow must never check out or run anything from a pull request.
permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: check-report
          path: report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- kepler-themes-check -->';
            const number = Number.parseInt(fs.readFileSync('report/pr-number', 'utf8').trim(), 10);
            if (!Number.isInteger(number) || number <= 0) throw new Error('No pull request number in the artifact.');
            // The number comes from the PR's own run, which the PR can edit, so it is
            // only trusted when that pull request is the one the run checked.
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: number });
            if (
              pr.head.sha !== run.head_sha ||
              pr.head.repo?.full_name !== run.head_repository.full_name ||
              pr.head.ref !== run.head_branch
            ) {
              throw new Error(`Pull request #${number} is not the one this run checked.`);
            }
            // The report is written by the PR's own run, so it cannot say what the PR changed. The
            // file list comes from the API, and this workflow runs from the default branch.
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo, pull_number: number, per_page: 100,
            });
            const paths = files.flatMap((f) => [f.filename, f.previous_filename].filter(Boolean));
            // GitHub lists at most 3000 files, so a longer list could hide a .github/ change past its
            // end. What cannot be seen counts as touching them.
            const touchesWorkflows = files.length < pr.changed_files || paths.some((p) => p.startsWith('.github/'));
            let banner = '';
            if (touchesWorkflows) {
              banner = "> **This pull request changes the gallery's workflows, so its check ran code it supplies. Neither its status nor the report below can be trusted: review it as code.**\n\n";
            } else if (paths.some((p) => !p.startsWith('themes/'))) {
              banner = "> **This pull request changes files outside `themes/`. The check ran `main`'s tooling, not this pull request's; the tooling tests job shows its effect.**\n\n";
            }
            // The report is data from an untrusted run: post it as text, with mentions defused so a theme
            // name cannot ping anyone. It is capped below, once the preview section's length is known.
            const report = fs.readFileSync('report/check-report.md', 'utf8').replaceAll('@', '@​');
            // Screenshots of the changed themes, from the check run's artifact. That run is the PR's own,
            // so the manifest and the PNG bytes are untrusted: nothing from them is used except bytes that
            // pass the checks below, and text that is escaped before it goes into the comment. They are only
            // published when the PR does not touch .github/, because then the run is main's tooling.
            const MAX_PREVIEWS = 24;
            const MAX_PNG_BYTES = 3 * 1024 * 1024;
            const MAX_TOTAL_BYTES = 30 * 1024 * 1024;
            const PNG_SIGNATURE = Buffer.from([0x89, 0x50, 0x4e, 0x47, 0x0d, 0x0a, 0x1a, 0x0a]);
            const isRecord = (v) => typeof v === 'object' && v !== null && !Array.isArray(v);
            // Cuts by code point, so an emoji at the cut is never split into half a pair.
            const cut = (text, length) => Array.from(text).slice(0, length).join('');
            // Names are contributor text. Turn markup and markdown characters into entities (GitHub shows
            // them as plain characters), drop line breaks, cap the length, and defuse mentions like the report.
            const safeText = (value) =>
              cut(String(value ?? '').replace(/[\u0000-\u001f\u007f\u2028\u2029]/g, ' ').trim(), 80)
                .replace(/[&<>"'*_`~|#!\[\]()\\]/g, (c) => `&#${c.charCodeAt(0)};`)
                .replaceAll('@', '@​');

            // The manifest's file names are only used to find a file, and only when they are a plain number.
            // Its slugs only group the images by family (two families can share a name); they never reach the comment.
            // Its polarity only places an image in the dark or the light column, and only when it is exactly one of the two.
            function readPreviews() {
              const none = { images: [], truncated: false };
              const dir = 'report/previews';
              if (!fs.existsSync(`${dir}/manifest.json`)) return none;
              let manifest;
              try {
                manifest = JSON.parse(fs.readFileSync(`${dir}/manifest.json`, 'utf8'));
              } catch {
                return none;
              }
              if (!isRecord(manifest) || !Array.isArray(manifest.previews)) return none;
              const images = [];
              let total = 0;
              for (const entry of manifest.previews.slice(0, MAX_PREVIEWS)) {
                if (!isRecord(entry) || typeof entry.file !== 'string' || !/^[0-9]{1,2}\.png$/.test(entry.file)) continue;
                const stat = fs.lstatSync(`${dir}/${entry.file}`, { throwIfNoEntry: false });
                if (!stat?.isFile() || stat.size > MAX_PNG_BYTES || total + stat.size > MAX_TOTAL_BYTES) continue;
                const bytes = fs.readFileSync(`${dir}/${entry.file}`);
                if (bytes.length < PNG_SIGNATURE.length || !bytes.subarray(0, PNG_SIGNATURE.length).equals(PNG_SIGNATURE)) continue;
                total += bytes.length;
                const family = safeText(entry.family);
                const polarity = entry.polarity === 'dark' || entry.polarity === 'light' ? entry.polarity : null;
                images.push({ bytes, group: typeof entry.slug === 'string' ? entry.slug : family, family, theme: safeText(entry.theme), polarity });
              }
              return { images, truncated: manifest.truncated === true || manifest.previews.length > MAX_PREVIEWS };
            }

            // Each pull request's images live in one parentless commit at `refs/previews/pr-<number>`,
            // written with the Git Data API so nothing is checked out. That ref is outside refs/heads
            // and refs/tags, so neither `git clone` nor actions/checkout downloads it, and a new push
            // replaces the commit instead of adding history, so old images become unreferenced and
            // GitHub drops them. Only this pull request's runs write its ref, and the identity check
            // above stops a run for an older head, but two runs of the same head (a re-run) can both get
            // here, so creating the ref falls back to moving it. The URLs name the commit, so GitHub's
            // image proxy never serves a stale picture after a new push.
            async function pushImages(images) {
              const ref = `previews/pr-${number}`;
              const tree = [];
              for (const image of images) {
                const { data: blob } = await github.rest.git.createBlob({
                  owner, repo, content: image.bytes.toString('base64'), encoding: 'base64',
                });
                tree.push({ path: image.path, mode: '100644', type: 'blob', sha: blob.sha });
              }
              const { data: newTree } = await github.rest.git.createTree({ owner, repo, tree });
              const { data: commit } = await github.rest.git.createCommit({
                owner, repo,
                message: `Previews for #${number} at ${pr.head.sha.slice(0, 7)}`,
                tree: newTree.sha,
                parents: [],
              });
              try {
                await github.rest.git.createRef({ owner, repo, ref: `refs/${ref}`, sha: commit.sha });
              } catch (err) {
                // 422: the ref already exists, from an earlier push or a run that got here first.
                if (err.status !== 422) throw err;
                await github.rest.git.updateRef({ owner, repo, ref, sha: commit.sha, force: true });
              }
              return commit.sha;
            }

            // Closing a pull request runs nothing, so each run also deletes the preview refs of pull
            // requests that are no longer open. Their comments then lose their images.
            async function pruneClosed() {
              try {
                const refs = await github.paginate(github.rest.git.listMatchingRefs, {
                  owner, repo, ref: 'previews/pr-', per_page: 100,
                });
                if (refs.length === 0) return;
                const open = new Set(
                  (await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', per_page: 100 })).map((p) => p.number),
                );
                for (const { ref } of refs) {
                  const match = /^refs\/previews\/pr-([0-9]+)$/.exec(ref);
                  if (!match || open.has(Number(match[1]))) continue;
                  await github.rest.git.deleteRef({ owner, repo, ref: ref.slice('refs/'.length) });
                }
              } catch (err) {
                core.warning(`Could not prune old previews: ${err instanceof Error ? err.message : String(err)}`);
              }
            }

            async function previewSection() {
              if (touchesWorkflows) {
                return "### Preview\n\nPreviews were skipped because this pull request changes the gallery's workflows, so its screenshots would come from a run it controls.\n\n";
              }
              try {
                const read = readPreviews();
                const images = read.images.map((image, i) => ({ ...image, path: `${i + 1}.png` }));
                if (images.length === 0) return '';
                const sha = await pushImages(images);
                // Each family is a table: a row per dark and light pair, dark on the left, and an image
                // with no usable polarity on a row of its own.
                const families = new Map();
                for (const image of images) {
                  const url = `https://raw.githubusercontent.com/${owner}/${repo}/${sha}/${image.path}`;
                  const alt = [image.family, image.theme].filter(Boolean).join(', ');
                  if (!families.has(image.group)) families.set(image.group, { name: image.family, dark: [], light: [], other: [] });
                  families.get(image.group)[image.polarity ?? 'other'].push(`<img src="${url}" width="400" alt="${alt}"><br>${image.theme}`);
                }
                const cell = (html) => `<td>${html ?? ''}</td>`;
                const cards = [...families.values()].map(({ name, dark, light, other }) => {
                  const rows = [];
                  for (let i = 0; i < Math.max(dark.length, light.length); i++) rows.push(`<tr>${cell(dark[i])}${cell(light[i])}</tr>`);
                  for (const html of other) rows.push(`<tr>${cell(html)}${cell()}</tr>`);
                  return `**${name || 'Theme'}**\n\n<table>\n${rows.join('\n')}\n</table>`;
                }).join('\n\n');
                const more = read.truncated ? `\n\nOnly the first ${MAX_PREVIEWS} variants are shown.` : '';
                return `### Preview\n\n${cards}${more}\n\n`;
              } catch (err) {
                core.warning(`Could not publish the previews: ${err instanceof Error ? err.message : String(err)}`);
                return '### Preview\n\nThe preview could not be published.\n\n';
              }
            }
            // GitHub refuses a comment over 65536 characters, so the report gets the room the rest leaves.
            const preview = await previewSection();
            const room = Math.max(0, Math.min(60000, 65000 - marker.length - banner.length - preview.length));
            // The order is banner, screenshots, report; only the report's tail can be cut, and the cut is
            // the review notes and scope a reader would otherwise assume were clean, so it says so.
            const CUT_NOTE = "\n\n**The rest of this report did not fit in this comment. The check run's summary has all of it.**";
            const shown = Array.from(report).length <= room ? report : `${cut(report, Math.max(0, room - CUT_NOTE.length))}${CUT_NOTE}`;
            const body = `${marker}\n${banner}${preview}${shown}`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: number, per_page: 100,
            });
            const existing = comments.find((c) => c.body?.startsWith(marker) && c.user?.type === 'Bot');
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: number, body });
            }
            await pruneClosed();
