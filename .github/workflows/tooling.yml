name: tooling

# Kept out of check.yml on purpose. The comment workflow publishes the artifacts of every `check`
# run, and this job runs code the pull request supplies, which could tamper with a later action
# step in the same run and upload an artifact of its own. In a workflow of its own, nothing it
# does can reach what the comment workflow reads (MAINTAINING.md).
on: pull_request

permissions:
  contents: read

jobs:
  # Not the gate. This runs the pull request's own tests of the tooling, and then its own check
  # over its own tree, which is code the PR supplies, so it is only safe because the token is
  # read-only and it holds no secrets. A PR can make these pass; the `check` job in check.yml is
  # what protects main. It is the one job that shows what changed tooling does to every family.
  tooling-tests:
    name: tooling tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node --test "scripts/__tests__/*.test.mjs"
      - name: Check themes with this pull request's tooling
        env:
          BASE_REF: ${{ github.base_ref }}
          CI: "1"
        run: node scripts/check.mjs --base "origin/$BASE_REF"
      # Runs this pull request's preview script before it lands on main. With no changed themes it
      # only writes an empty manifest and never starts Chrome; the screenshot test in the tests
      # above is what shows Chrome starts on the runner.
      - name: Preview the changed themes with this pull request's tooling
        if: always()
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/preview.mjs --base "origin/$BASE_REF" --out preview-smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: preview-smoke
          path: preview-smoke/
